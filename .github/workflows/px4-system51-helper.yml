name: PX4 rebuild fixed system 5.1 helper
on:
  workflow_dispatch:
permissions: {}
jobs:
  helper:
    runs-on: windows-latest
    steps:
      - name: Fetch exact public source without credentials
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git -c credential.helper= init -q
          git config core.autocrlf false
          git -c credential.helper= fetch --depth=1 "https://github.com/$SOURCE_REPOSITORY.git" "$SOURCE_REVISION"
          git checkout --detach FETCH_HEAD
      - name: Compile fixed AnyCPU .NET Framework helper using system 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'SYSTEM_PS51_REQUIRED'}
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/px4-helper"|Out-Null
          $binary="$env:RUNNER_TEMP/px4-helper/windows-detached.dll"
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /target:library /platform:anycpu /optimize+ "/out:$binary" (Join-Path $PWD 'agent\bin\windows-detached.cs')
          if($LASTEXITCODE -ne 0){throw 'COMPILE_FAILED'}
          $launcher="$env:RUNNER_TEMP/px4-helper/windows-launcher.exe"
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(!$installation){throw 'MSVC_BUILD_TOOLS_REQUIRED'}
          $vcvars=Join-Path $installation 'VC/Auxiliary/Build/vcvars32.bat'
          $source=(Join-Path $PWD 'agent\bin\windows-launcher.cpp')
          $object="$env:RUNNER_TEMP/px4-helper/windows-launcher.obj"
          & $env:COMSPEC /d /s /c ('""'+$vcvars+'" && cl.exe /nologo /O1 /MT /EHsc /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 "'+$source+'" /Fo"'+$object+'" /Fe"'+$launcher+'" /link bcrypt.lib"')
          if($LASTEXITCODE -ne 0){throw 'COMPILE_FAILED'}
          Remove-Item -LiteralPath $object
          @{builtFromRevision='${{ github.sha }}';schemaVersion=1;architecture='AnyCPU';targetFramework='.NET Framework 4';sourceSha256=(Get-FileHash agent/bin/windows-detached.cs).Hash.ToLowerInvariant();sha256=(Get-FileHash $binary).Hash.ToLowerInvariant();launcherSha256=(Get-FileHash $launcher).Hash.ToLowerInvariant();launcherSourceSha256=(Get-FileHash agent/bin/windows-launcher.cpp).Hash.ToLowerInvariant();launcherArchitecture='x86'}|ConvertTo-Json|Set-Content -Encoding UTF8 "$env:RUNNER_TEMP/px4-helper/windows-detached.json"
          [Reflection.Assembly]::Load([IO.File]::ReadAllBytes($binary))|Out-Null
          if([HanaMeshDetached]::NativeArchitecture() -ne 'x64'){throw 'ARCH_FAILED'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: px4-system51-helper
          path: ${{ runner.temp }}/px4-helper
          retention-days: 7
