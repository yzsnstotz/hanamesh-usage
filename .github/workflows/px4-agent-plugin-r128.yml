name: PX4 R128 Agent plugin repair
on:
  push:
    branches: [fix/px4-agent-plugin-r128-1109]
  workflow_dispatch:
permissions: {}
jobs:
  plugin:
    timeout-minutes: 25 # 待追认：原生 job 封顶，保留全部失败。
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, os: linux, arch: x64, cli: minimum}
          - {runner: ubuntu-latest, os: linux, arch: x64, cli: latest}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, cli: minimum}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, cli: latest}
          - {runner: windows-latest, os: win32, arch: x64, cli: minimum}
          - {runner: windows-latest, os: win32, arch: x64, cli: latest}
          - {runner: windows-11-arm, os: win32, arch: arm64, cli: minimum}
          - {runner: windows-11-arm, os: win32, arch: arm64, cli: latest}
          - {runner: macos-26-intel, os: darwin, arch: x64, cli: minimum}
          - {runner: macos-26-intel, os: darwin, arch: x64, cli: latest}
          - {runner: macos-latest, os: darwin, arch: arm64, cli: minimum}
          - {runner: macos-latest, os: darwin, arch: arm64, cli: latest}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact public source without credentials
        env:
          PX2_REPOSITORY: ${{ github.repository }}
          PX2_REVISION: ${{ github.sha }}
        run: |
          git -c credential.helper= init -q
          git config core.autocrlf false
          git config core.eol lf
          git -c credential.helper= fetch --depth=1 "https://github.com/$PX2_REPOSITORY.git" "$PX2_REVISION"
          git checkout --detach FETCH_HEAD
      - name: System Windows PowerShell 5.1 syntax and native OS detection
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1){throw 'SYSTEM_PS51_REQUIRED'}
          . ./agent/bin/windows-detached.ps1
          Initialize-HanaMeshDetached
          $native=[HanaMeshDetached]::NativeArchitecture()
          if($native -ne '${{ matrix.arch }}'){throw 'NATIVE_OS_ARCH_REQUIRED'}
          @{version=$PSVersionTable.PSVersion.ToString();executable=[Diagnostics.Process]::GetCurrentProcess().MainModule.FileName;nativeOS=$native;pointerSize=[IntPtr]::Size}|ConvertTo-Json -Compress
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'agent/bin/hm-agent.ps1'),[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};exit 1}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.1'
          token: ''
      - name: Assert actual native OS and architecture
        run: node -e "if(process.platform!=='${{ matrix.os }}'||process.arch!=='${{ matrix.arch }}')process.exit(1)"
      - name: Prepare isolated paths
        run: node tools/agent-compat-cli.mjs prepare
      - name: Prepare strict pinned build tools and dependencies
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/px2/npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/px2/global-npmrc
        run: |
          npm install --global pnpm@10.33.0
          npm ci --cache .npm-cache
          pnpm install --frozen-lockfile
          if [[ "$RUNNER_OS" == Windows ]]; then echo "$(cygpath -w /usr/bin)" >> "$GITHUB_PATH"; fi
      - name: Normal strict target build
        run: node tools/build.mjs
      - name: Remove PS7 resolution for every Windows runtime and CLI gate
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $clean=($env:PATH.Split(';')|Where-Object {$_ -and !(Test-Path -LiteralPath (Join-Path $_ 'pwsh.exe'))}) -join ';'
          "PATH=$clean"|Out-File -Encoding utf8 -Append $env:GITHUB_ENV
      - name: Prove pwsh is unavailable and system 5.1 remains executable
        if: runner.os == 'Windows'
        run: |
          node -e "const{spawnSync:s}=require('node:child_process');if(s('where.exe',['pwsh.exe']).status===0)throw Error('PWSH_MUST_NOT_RESOLVE');const r=s('powershell.exe',['-NoProfile','-Command','[Console]::Write(\$PSVersionTable.PSVersion.ToString())'],{encoding:'utf8'});console.log(r.stdout);if(r.status!==0||!r.stdout.startsWith('5.1.'))throw Error('SYSTEM_PS51_REQUIRED')"
      # 待追认：首次 Git Bash → 系统 5.1 的空命令本身在 windows-11-arm 约 10s、之后 <1s
      # （x64 Git Bash 经仿真派生原生 ARM64 powershell.exe 的一次性 OS 成本，非插件代码；run 42490408070）。
      # 先实测并打印这次空启动，后续插件门期限一律不变。
      - name: Measure the runner's own Git Bash to system 5.1 first launch outside plugin gates
        if: runner.os == 'Windows'
        run: |
          node -e "const{spawnSync:s}=require('node:child_process'),t=performance.now(),r=s('bash',['-c','\"\$SYSTEMROOT/System32/WindowsPowerShell/v1.0/powershell.exe\" -NoLogo -NoProfile -NonInteractive -Command \"exit 0\"'],{encoding:'utf8'});console.log('SYSTEM_CHAIN_FIRST_LAUNCH_MS='+Math.round(performance.now()-t));if(r.status!==0)throw Error('SYSTEM_PS51_LAUNCH_FAILED: '+r.stderr)"
      - name: Current Agent fixed-runtime and manifest unit gates
        timeout-minutes: 8
        run: node --test --test-concurrency=1 --test-reporter=tap tests/agent-node-runtime.test.mjs tests/agent-runtime-background.test.mjs tests/agent-runtime-recovery.test.mjs tests/agent-preparation-recording.test.mjs tests/node-tool.test.mjs 2>&1 | tee "$RUNNER_TEMP/px2/native-tests.log"
      - name: All current Agent behavior tests
        if: matrix.cli == 'minimum'
        timeout-minutes: 8
        run: node --test --test-concurrency=1 --test-reporter=tap tests/agent*.test.mjs
      - name: Confirm clean isolated Git source before materialization
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: ${{ runner.os == 'Windows' && 'NUL' || '/dev/null' }}
        run: |
          git status --short
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Official CLI minimum or latest installation gates
        run: node tools/agent-compat-cli.mjs '${{ matrix.cli }}'
      - name: Current Agent consent-withheld and closed hook payloads
        run: node tools/verify-agent-package.mjs "$RUNNER_TEMP/px2/plugin with spaces" 2>&1 | tee "$RUNNER_TEMP/px2/privacy.log"
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: px4-${{ matrix.runner }}-${{ matrix.cli }}
          path: |
            ${{ runner.temp }}/px2/results.json
            ${{ runner.temp }}/px2/native-tests.log
            ${{ runner.temp }}/px2/privacy.log
          retention-days: 7
      - name: Archive exact current publish candidate with modes
        if: matrix.os == 'linux' && matrix.arch == 'x64' && matrix.cli == 'minimum'
        run: tar -czf "$RUNNER_TEMP/px2/agent-0.2.9.tgz" -C "$RUNNER_TEMP/px2/plugin with spaces" .
      - name: Preserve exact current publish candidate
        if: matrix.os == 'linux' && matrix.arch == 'x64' && matrix.cli == 'minimum'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: px4-agent-0.2.9-candidate
          path: ${{ runner.temp }}/px2/agent-0.2.9.tgz
          include-hidden-files: true
          retention-days: 7
