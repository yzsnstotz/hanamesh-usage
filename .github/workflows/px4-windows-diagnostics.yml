name: PX4 system Windows shell diagnostics
on:
  push:
    branches: [ci/px4-system51-diagnostics]
permissions: {}
jobs:
  helper:
    runs-on: windows-latest
    steps:
      - name: Fetch exact public diagnostic source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git -c credential.helper= init -q
          git config core.autocrlf false
          git -c credential.helper= fetch --depth=1 "https://github.com/$SOURCE_REPOSITORY.git" "$SOURCE_REVISION"
          git checkout --detach FETCH_HEAD
      - name: Compile fixed AnyCPU .NET Framework helper using system 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'SYSTEM_PS51_REQUIRED'}
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/px4-helper"|Out-Null
          $binary="$env:RUNNER_TEMP/px4-helper/windows-detached.dll"
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /target:library /platform:anycpu /optimize+ "/out:$binary" (Join-Path $PWD 'agent\bin\windows-detached.cs')
          if($LASTEXITCODE -ne 0){throw 'COMPILE_FAILED'}
          $launcher="$env:RUNNER_TEMP/px4-helper/windows-launcher.exe"
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(!$installation){throw 'MSVC_BUILD_TOOLS_REQUIRED'}
          $vcvars=Join-Path $installation 'VC/Auxiliary/Build/vcvars32.bat'
          $source=(Join-Path $PWD 'agent\bin\windows-launcher.cpp')
          $object="$env:RUNNER_TEMP/px4-helper/windows-launcher.obj"
          & $env:COMSPEC /d /s /c ('""'+$vcvars+'" && cl.exe /nologo /O1 /MT /EHsc /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 "'+$source+'" /Fo"'+$object+'" /Fe"'+$launcher+'" /link bcrypt.lib"')
          if($LASTEXITCODE -ne 0){throw 'COMPILE_FAILED'}
          Remove-Item -LiteralPath $object
          @{builtFromRevision='${{ github.sha }}';schemaVersion=1;architecture='AnyCPU';targetFramework='.NET Framework 4';sourceSha256=(Get-FileHash agent/bin/windows-detached.cs).Hash.ToLowerInvariant();sha256=(Get-FileHash $binary).Hash.ToLowerInvariant();launcherSha256=(Get-FileHash $launcher).Hash.ToLowerInvariant();launcherSourceSha256=(Get-FileHash agent/bin/windows-launcher.cpp).Hash.ToLowerInvariant();launcherArchitecture='x86'}|ConvertTo-Json|Set-Content -Encoding UTF8 "$env:RUNNER_TEMP/px4-helper/windows-detached.json"
          [Reflection.Assembly]::Load([IO.File]::ReadAllBytes($binary))|Out-Null
          if([HanaMeshDetached]::NativeArchitecture() -ne 'x64'){throw 'ARCH_FAILED'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: px4-system51-helper
          path: ${{ runner.temp }}/px4-helper
          retention-days: 7

  shell:
    needs: helper
    runs-on: windows-11-arm
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shell: [Bridge, Native]
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact public diagnostic source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git -c credential.helper= init -q
          git config core.autocrlf false
          git -c credential.helper= fetch --depth=1 "https://github.com/$SOURCE_REPOSITORY.git" "$SOURCE_REVISION"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.1'
          token: ''
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: px4-system51-helper
          path: agent/bin
      - name: Normalize public asset metadata without changing hashes
        run: |
          node --input-type=module -e "import{readFileSync,writeFileSync}from'node:fs';const p='agent/bin/windows-detached.json';writeFileSync(p,readFileSync(p,'utf8').replace(/^\uFEFF/,''));"
      - name: Select installed Git Bash
        run: echo "$(cygpath -w /usr/bin)" >> "$GITHUB_PATH"
      - name: Instrument only disposable fixture timing
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          let s=await readFile('agent/bin/hm-agent.ps1','utf8');
          const mark=label=>`[Console]::Error.WriteLine('PX4_TIME_${label}='+[DateTime]::UtcNow.ToString('o'))`;
          s=s.replace('$AgentArgs = @($args)','$AgentArgs = @($args)\n'+mark('PS_ENTER'));
          s=s.replace("  . ([IO.Path]::Combine($PSScriptRoot,'windows-primitives.ps1'))","  . ([IO.Path]::Combine($PSScriptRoot,'windows-primitives.ps1'))\n"+mark('PRIMITIVES'));
          s=s.replace('  Initialize-HanaMeshDetached','  Initialize-HanaMeshDetached\n'+mark('HELPER')+`\n$flags=[Reflection.BindingFlags]'NonPublic,Static';$handle=[HanaMeshDetached].GetMethod('GetCurrentProcess',$flags).Invoke($null,@());$types=@($handle,[uint16]0,[uint16]0);$ok=[HanaMeshDetached].GetMethod('IsWow64Process2',$flags).Invoke($null,$types);[Console]::Error.WriteLine('PX4_PROCESS_MACHINE='+$types[1].ToString('x')+' NATIVE='+$types[2].ToString('x'))`);
          s=s.replace('    Check-Version $node','    '+mark('HASH_DONE')+'\n    Check-Version $node\n    '+mark('VERSION_DONE'));
          await writeFile('agent/bin/hm-agent.ps1',s);
          s=await readFile('agent/bin/hm-agent','utf8');s=s.replace('umask 077',`umask 077\nprintf 'PX4_TIME_SH_ENTER=%s\\n' "$EPOCHREALTIME" >&2`);await writeFile('agent/bin/hm-agent',s);
          s=await readFile('tests/agent-node-runtime.test.mjs','utf8');if('${{ matrix.shell }}'==='Native')s=s.replace("process.platform==='win32'&&channel==='codex'?","process.platform==='win32'&&channel==='claude'?spawnSync('powershell.exe',['-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',join(f.plugin,'bin/hm-agent.ps1'),'hook','--event',event],{env:f.env,input:'{}',encoding:'utf8'}):process.platform==='win32'&&channel==='codex'?");s=s.replace("  if(process.platform==='win32')assert.ok", "  console.log('PX4_ACTUAL_MANIFEST_MS='+String(performance.now()-started)+' '+channel+' '+event+' '+r.stderr);\n  if(process.platform==='win32')assert.ok");await writeFile('tests/agent-node-runtime.test.mjs',s);
          JS
      - name: Exact Claude hook command under the unchanged 10-second assertion
        run: node --test --test-reporter=tap --test-name-pattern='installed claude' tests/agent-node-runtime.test.mjs
