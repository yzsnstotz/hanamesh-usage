name: PX4 system Windows shell diagnostics
on:
  push:
    branches: [ci/px4-system51-diagnostics]
permissions: {}
jobs:
  shell:
    runs-on: windows-11-arm
    timeout-minutes: 8
    strategy:
      matrix:
        shell: [System32, Sysnative]
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact public diagnostic source
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git -c credential.helper= init -q
          git config core.autocrlf false
          git -c credential.helper= fetch --depth=1 "https://github.com/$SOURCE_REPOSITORY.git" "$SOURCE_REVISION"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.1'
          token: ''
      - name: Select installed Git Bash
        run: echo "$(cygpath -w /usr/bin)" >> "$GITHUB_PATH"
      - name: Instrument only disposable fixture timing
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          let s=await readFile('agent/bin/hm-agent.ps1','utf8');
          const mark=label=>`[Console]::Error.WriteLine('PX4_TIME_${label}='+[DateTime]::UtcNow.ToString('o'))`;
          s=s.replace('$AgentArgs = @($args)','$AgentArgs = @($args)\n'+mark('PS_ENTER'));
          s=s.replace("  . ([IO.Path]::Combine($PSScriptRoot,'windows-primitives.ps1'))","  . ([IO.Path]::Combine($PSScriptRoot,'windows-primitives.ps1'))\n"+mark('PRIMITIVES'));
          s=s.replace('  Initialize-HanaMeshDetached','  Initialize-HanaMeshDetached\n'+mark('HELPER')+`\n$flags=[Reflection.BindingFlags]'NonPublic,Static';$handle=[HanaMeshDetached].GetMethod('GetCurrentProcess',$flags).Invoke($null,@());$types=@($handle,[uint16]0,[uint16]0);$ok=[HanaMeshDetached].GetMethod('IsWow64Process2',$flags).Invoke($null,$types);[Console]::Error.WriteLine('PX4_PROCESS_MACHINE='+$types[1].ToString('x')+' NATIVE='+$types[2].ToString('x'))`);
          s=s.replace('    Check-Version $node','    '+mark('HASH_DONE')+'\n    Check-Version $node\n    '+mark('VERSION_DONE'));
          await writeFile('agent/bin/hm-agent.ps1',s);
          s=await readFile('agent/bin/hm-agent','utf8');s=s.replace('/System32/WindowsPowerShell','/${{ matrix.shell }}/WindowsPowerShell');s=s.replace('umask 077',`umask 077\nprintf 'PX4_TIME_SH_ENTER=%s\\n' "$EPOCHREALTIME" >&2`);await writeFile('agent/bin/hm-agent',s);
          s=await readFile('tests/agent-node-runtime.test.mjs','utf8');s=s.replace("  if(process.platform==='win32')assert.ok", "  console.log('PX4_ACTUAL_MANIFEST_MS='+String(performance.now()-started)+' '+channel+' '+event+' '+r.stderr);\n  if(process.platform==='win32')assert.ok");await writeFile('tests/agent-node-runtime.test.mjs',s);
          JS
      - name: Exact Claude hook command under the unchanged 10-second assertion
        run: node --test --test-reporter=tap --test-name-pattern='installed claude' tests/agent-node-runtime.test.mjs
